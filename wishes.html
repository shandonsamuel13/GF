<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wishes — Anuksha</title>
<link rel="stylesheet" href="style.css">
<style>
  .wish-hero {
    text-align: center;
    padding: 1rem 0 2rem;
  }

  .wish-carousel {
    position: relative;
    max-width: 640px;
    margin: 2rem auto 0;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wish-slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(1.3rem, 4vw, 1.9rem);
    color: var(--cream);
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.8s ease, transform 0.8s ease;
    padding: 0 1rem;
  }

  .wish-slide.active { opacity: 1; transform: scale(1); }
  .wish-slide::before,
  .wish-slide::after { content: '"'; color: var(--gold); opacity: 0.6; }

  .wish-dots {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1.6rem;
  }
  .wish-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(217,169,78,0.35);
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .wish-dot.active { background: var(--gold); transform: scale(1.3); }

  .slogan-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1.1rem;
    margin-top: 4rem;
  }

  .slogan-card {
    padding: 1.6rem;
    border-radius: 16px;
    text-align: center;
    background: linear-gradient(160deg, rgba(232,96,127,0.14), rgba(122,37,69,0.05));
    border: 1px solid rgba(245,198,208,0.18);
    transition: transform 0.35s ease;
  }
  .slogan-card:hover { transform: translateY(-4px) rotate(-0.5deg); }
  .slogan-card .icon { font-size: 1.5rem; }
  .slogan-card p {
    font-family: var(--display);
    font-size: 1.15rem;
    font-style: italic;
    margin: 0.7rem 0 0;
    color: var(--blush-soft);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="hearts-layer"></div>

<nav class="site-nav">
  <span class="brand">A.</span>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="letter.html">Love Letter</a></li>
    <li><a href="reasons.html">22 Reasons</a></li>
    <li><a href="wishes.html">Wishes</a></li>
    <li><a href="surprise.html">Surprise</a></li>
  </ul>
</nav>

<main>
  <section class="wish-hero">
    <p class="eyebrow">everything I wish for you</p>
    <h1 style="font-size: clamp(2rem, 6vw, 3rem); margin-top: 0.6rem; font-style: italic;">
      Birthday Wishes
    </h1>

    <div class="wish-carousel" id="carousel"></div>
    <div class="wish-dots" id="dots"></div>
  </section>

  <section>
    <div class="slogan-grid" id="sloganGrid"></div>
  </section>
</main>

<footer class="site-footer">
  made with a <span class="heart">♥</span> for Anuksha
</footer>

<script src="script.js"></script>
<script>
  const wishes = [
    "May this year hand you every soft thing you've quietly hoped for.",
    "May you keep choosing yourself as fiercely as you choose everyone else.",
    "May your ambitions grow bigger than your doubts, every single time.",
    "May the people who love you keep showing up exactly like you deserve.",
    "May 22 be the year your patience finally gets its reward.",
  ];

  const carousel = document.getElementById('carousel');
  const dots = document.getElementById('dots');

  wishes.forEach((text, i) => {
    const slide = document.createElement('div');
    slide.className = 'wish-slide' + (i === 0 ? ' active' : '');
    slide.textContent = text;
    carousel.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'wish-dot' + (i === 0 ? ' active' : '');
    dots.appendChild(dot);
  });

  let idx = 0;
  const slides = document.querySelectorAll('.wish-slide');
  const dotEls = document.querySelectorAll('.wish-dot');

  setInterval(() => {
    slides[idx].classList.remove('active');
    dotEls[idx].classList.remove('active');
    idx = (idx + 1) % slides.length;
    slides[idx].classList.add('active');
    dotEls[idx].classList.add('active');
  }, 3800);

  const slogans = [
    { icon: '🌙', text: "You are my favourite hello and hardest goodbye." },
    { icon: '🌸', text: "Every year with you feels like a good decision, twice over." },
    { icon: '🕯️', text: "Here's to the girl who makes ordinary days feel golden." },
    { icon: '💫', text: "Not all magic wears a cape — some of it just turned 22." },
    { icon: '🎀', text: "Loving you is the easiest thing I've ever done well." },
    { icon: '🦋', text: "May your year be as soft as you are to everyone else." },
  ];

  const grid = document.getElementById('sloganGrid');
  slogans.forEach((s) => {
    const card = document.createElement('div');
    card.className = 'slogan-card reveal';
    card.innerHTML = `<span class="icon">${s.icon}</span><p>${s.text}</p>`;
    grid.appendChild(card);
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.slogan-card').forEach((c) => io.observe(c));
</script>

<div class="center" style="position: relative; z-index: 2; padding-bottom: 2rem;">
  <a href="surprise.html" class="btn">Now… Your Surprise →</a>
</div>

</body>
</html>
